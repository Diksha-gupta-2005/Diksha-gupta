<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placement Eligibility Check</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f8fb;
}

.container{
    width:80%;
    max-width:700px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#0077b6;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#0077b6;
    color:#fff;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#023e8a;
}

#result{
    margin-top:20px;
    padding:15px;
    border-radius:5px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

table{
    width:100%;
    margin-top:25px;
    border-collapse:collapse;
}

table th{
    background:#0077b6;
    color:white;
    padding:10px;
}

table td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}
</style>

</head>

<body>

<div class="container">

<h1>Placement Eligibility Checker</h1>

<div class="form-group">
<label>Student Name</label>
<input type="text" id="name">
</div>

<div class="form-group">
<label>Course</label>

<select id="course">
<option>B.Tech</option>
<option>BCA</option>
<option>B.Sc</option>
<option>MCA</option>
<option>MBA</option>
</select>

</div>

<div class="form-group">
<label>10th Percentage</label>
<input type="number" id="tenth">
</div>

<div class="form-group">
<label>12th Percentage</label>
<input type="number" id="twelfth">
</div>

<div class="form-group">
<label>Current CGPA</label>
<input type="number" step="0.1" id="cgpa">
</div>

<div class="form-group">
<label>Active Backlogs</label>
<input type="number" id="backlogs">
</div>

<div class="form-group">
<label>Programming Skill</label>

<select id="skill">
<option>Java</option>
<option>Python</option>
<option>C++</option>
<option>JavaScript</option>
<option>MERN Stack</option>
</select>

</div>

<button onclick="checkEligibility()">

Check Eligibility

</button>

<div id="result"></div>

<h2 style="margin-top:30px;">Eligibility Criteria</h2>

<table>

<tr>
<th>Criteria</th>
<th>Required</th>
</tr>

<tr>
<td>10th Percentage</td>
<td>60% or Above</td>
</tr>

<tr>
<td>12th Percentage</td>
<td>60% or Above</td>
</tr>

<tr>
<td>CGPA</td>
<td>7.0 or Above</td>
</tr>

<tr>
<td>Backlogs</td>
<td>0</td>
</tr>

</table>

</div>

<script>

function checkEligibility(){

let name=document.getElementById("name").value;

let tenth=parseFloat(document.getElementById("tenth").value);

let twelfth=parseFloat(document.getElementById("twelfth").value);

let cgpa=parseFloat(document.getElementById("cgpa").value);

let backlog=parseInt(document.getElementById("backlogs").value);

let result=document.getElementById("result");

if(name==""){
alert("Please Enter Student Name");
return;
}

if(isNaN(tenth)||isNaN(twelfth)||isNaN(cgpa)||isNaN(backlog)){
alert("Please Fill All Fields");
return;
}

if(tenth>=60 && twelfth>=60 && cgpa>=7 && backlog==0){

result.style.background="#d4edda";
result.style.color="green";

result.innerHTML="🎉 Congratulations "+name+
"<br><br>You are Eligible for Campus Placement.";

}
else{

result.style.background="#f8d7da";
result.style.color="red";

result.innerHTML="❌ Sorry "+name+
"<br><br>You are Not Eligible for Campus Placement.";

}

}

</script>
<script src="js/eligibility.js"></script>
</body>
</html>
