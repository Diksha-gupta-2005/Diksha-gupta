<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Admission Form</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admission.css">
<link rel="stylesheet" href="css/responsive.css">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f8fb;
}

.container{
    width:80%;
    max-width:800px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#0077b6;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

textarea{
    resize:none;
}

button{
    width:100%;
    padding:12px;
    background:#0077b6;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#023e8a;
}
</style>

</head>
<body>

<div class="container">

<h1>College Admission Form</h1>

<form id="admissionForm">

<h3>Personal Details</h3>

<div class="form-group">
<label>Full Name</label>
<input type="text" id="name" required>
</div>

<div class="form-group">
<label>Father's Name</label>
<input type="text" id="father" required>
</div>

<div class="form-group">
<label>Mother's Name</label>
<input type="text" id="mother" required>
</div>

<div class="form-group">
<label>Date of Birth</label>
<input type="date" id="dob" required>
</div>

<div class="form-group">
<label>Gender</label>
<select id="gender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label>Mobile Number</label>
<input type="tel" id="mobile" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email" required>
</div>

<div class="form-group">
<label>Address</label>
<textarea rows="3" id="address"></textarea>
</div>

<h3>Academic Details</h3>

<div class="form-group">
<label>10th Percentage</label>
<input type="number" id="tenth" required>
</div>

<div class="form-group">
<label>12th Percentage</label>
<input type="number" id="twelfth" required>
</div>

<div class="form-group">
<label>Course Applying For</label>

<select id="course">

<option>B.Tech</option>
<option>BCA</option>
<option>B.Sc</option>
<option>B.Com</option>
<option>MCA</option>
<option>MBA</option>

</select>

</div>

<h3>Upload Documents</h3>

<div class="form-group">
<label>Upload 10th Marksheet</label>
<input type="file">
</div>

<div class="form-group">
<label>Upload 12th Marksheet</label>
<input type="file">
</div>

<div class="form-group">
<label>Upload Aadhaar Card</label>
<input type="file">
</div>

<div class="form-group">
<label>Upload Passport Size Photo</label>
<input type="file">
</div>

<button type="submit">
Submit Admission Form
</button>

</form>

</div>

<script>

document.getElementById("admissionForm").addEventListener("submit",function(e){

e.preventDefault();

let name=document.getElementById("name").value;
let course=document.getElementById("course").value;

alert(
"Admission Form Submitted Successfully!\n\n"+
"Student : "+name+
"\nCourse : "+course+
"\n\nThank you for applying."
);

this.reset();

});

</script>
<script src="js/admission.js"></script>
</body>
</html>
